version: '3.8'

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: portfolio_engine_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data

  web:
    build:
      context: .
      dockerfile: Containerfile
    container_name: portfolio_engine_web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=database,1433;Database=PortfolioEngineDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
    ports:
      - "8080:80"
    depends_on:
      - database

volumes:
  mssql_data: